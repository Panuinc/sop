<script>
function downloadSVG() {
  const svg = document.querySelector('#diagram svg');
  if (!svg) return;
  const ser = new XMLSerializer().serializeToString(svg);
  const xml = '<?xml version="1.0" encoding="UTF-8"?>
' + ser;
  const blob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'workflow_chh.svg';
  a.click();
}
function downloadPNG() {
  const svg = document.querySelector('#diagram svg');
  if (!svg) return;
  const ser = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([ser], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = function() {
    const scale = 2;
    const w = svg.viewBox.baseVal.width || svg.clientWidth;
    const h = svg.viewBox.baseVal.height || svg.clientHeight;
    const canvas = document.createElement('canvas');
    canvas.width = w * scale; canvas.height = h * scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.scale(scale, scale); ctx.drawImage(img, 0, 0, w, h);
    canvas.toBlob(function(b) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'workflow_chh.png';
      a.click();
    }, 'image/png');
    URL.revokeObjectURL(url);
  };
  img.src = url;
}
</script>
